"area: core":
  - changed-files:
      - any-glob-to-any-file: "src/**"

"area: agents":
  - changed-files:
      - any-glob-to-any-file: ".agents/**"

"area: tests":
  - changed-files:
      - any-glob-to-any-file: "tests/**"

"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "*.md"

"area: ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - ".githooks/**"
          - "scripts/**"
          - "Makefile"
          - "pyproject.toml"
